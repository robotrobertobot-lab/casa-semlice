<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Semplice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f5f5f7;padding-bottom:90px}
header{background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
header h1{font-size:17px;font-weight:700}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card h2{font-size:20px;margin-bottom:14px}
.stats{display:flex;gap:12px;margin-bottom:14px}
.stat{flex:1;background:#fafafb;border:1px solid #f0f0f0;border-radius:14px;padding:14px}
.stat strong{font-size:22px;display:block}
.stat span{font-size:13px;color:#555}
.btn{width:100%;background:#111;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:600}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#999;font-size:12px;font-weight:600}
.nav.active{color:#111}
.nav svg{width:22px;height:22px}
</style>
</head>
<body>
<header>
<h1>Casa Semplice - FIXATO</h1>
<select><option>Condomino</option></select>
</header>
<div class="card">
<h2>Benvenuto condomino</h2>
<div class="stats">
<div class="stat"><strong>5</strong><span>Tot Condomini</span></div>
<div class="stat"><strong>2</strong><span>Guasti Aperti</span></div>
</div>
<button class="btn">+ Segnala Guasto</button>
</div>
<div class="card"><div style="font-weight:600">Comunicazioni</div></div>
<nav class="bottom-nav">
<div class="nav active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>Home</div>
<div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>Guasti</div>
<div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Cassa</div>
<div class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Vota</div>
</nav>
</body>
                  </html>
